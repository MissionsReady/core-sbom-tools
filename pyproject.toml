[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "missionsready-sbom-tools"
version = "1.0.0"
description = "Deterministic per-platform Syft SPDX JSON evidence tooling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
missionsready-sbom = "missionsready_sbom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
